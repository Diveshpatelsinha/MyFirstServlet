<!DOCTYPE html>
<html>
<head>
    <title>First Servlet App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: #f0f0f0;
        }
        h1 { color: #333; }
        a {
            display: inline-block;
            padding: 12px 24px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
            margin: 10px;
        }
        a:hover { background-color: #45a049; }
    </style>
</head>
<body>

<h1>Welcome to My First Servlet App!</h1>
<p>Click the button to call our Servlet:</p>

<!-- GET request — clicking a link sends GET -->
<a href="hello">Say Hello (GET)</a>

<!-- POST request — needs a form -->
<form action="hello" method="post" style="margin-top:20px;">
    <input type="text"
           name="username"
           placeholder="Enter your name"
           style="padding:10px; font-size:14px;">
    <br><br>
    <input type="submit"
           value="Greet Me (POST)"
           style="padding:12px 24px;
                      background:#2196F3;
                      color:white;
                      border:none;
                      border-radius:5px;
                      font-size:16px;
                      cursor:pointer;">
</form>

</body>
</html>
